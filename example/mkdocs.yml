site_name: Beacon Docs (example)
site_description: Fictional reference product — demonstrates the docs patterns.

# Theme / plugins / extensions / hooks mirror the root mkdocs.yml (canonical while
# example/ exists). Only site_name, site_description, and nav differ.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags
  - d2
  - glightbox

hooks:
  - /usr/local/lib/docs/hook.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Features:
      - features/index.md
      - Plan upgrade: features/plan-upgrade.md
  - Services:
      - services/index.md
      - billing-service: services/billing-service.md
      - messaging-service: services/messaging-service.md
  - Models:
      - models/index.md
      - Subscription: models/subscription.md
      - Delivery event: models/delivery-event.md
      - Organization: models/organization.md
  - Datastores:
      - MySQL: datastores/mysql.md
      - PostgreSQL: datastores/postgresql.md
      - MongoDB: datastores/mongodb.md
      - RabbitMQ: datastores/rabbitmq.md
  - Glossary: glossary.md
  - Decisions:
      - decisions/index.md
      - "0001 — Delivery events in MongoDB": decisions/0001-delivery-events-in-mongodb.md
