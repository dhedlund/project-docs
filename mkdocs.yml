site_name: Project Docs
site_description: Product-wide knowledge base — features, services, and data models.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path          # breadcrumbs
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags
  - d2:         # render ```d2 diagrams (uses the d2 binary in the toolkit image)
      dark_theme: 200   # also emit a dark variant; toggles with Material's palette
  - glightbox   # click-to-zoom for images / diagrams

# Status badges + derived "Used by" backlinks (baked into the toolkit image).
hooks:
  - /usr/local/lib/docs/hook.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details          # collapsible admonitions (??? )
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets         # shared fragments to avoid duplication
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid       # inline Mermaid diagrams
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true   # content tabs (e.g. multi-language examples)
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Features: features/index.md
  - Services: services/index.md
  - Models: models/index.md
  - Decisions: decisions/index.md
